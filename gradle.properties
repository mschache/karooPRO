karoopro.releaseNotes=Easier to read. A row of values now shares one size for its numbers and one for its labels, and on Dash Panels each column is as wide as its value needs, so the numbers stay large. Settings: no more cut-off titles, the cadence band reads From and To, controls are white with orange kept for the section titles, and the buttons are larger. The Preview shows Dash Panels at the map page's real size.
