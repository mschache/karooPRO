karoopro.releaseNotes=New: Pace panel with a Power Guide-style target for the route ahead, stamina and arrival time. Fuel panel with carbs burned vs eaten, eat and drink reminders, and logging by tap or button. Results panel with your finished climbs and segments. PRO Strip field for map pages. Beeps at the smallest and largest cog. Workout colors shade with how far off target you are. W' balance, carbs, stamina and headwind are written to your FIT file.
