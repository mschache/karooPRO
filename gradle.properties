karoopro.releaseNotes=Closer to the original idea. The Ride tiles get an icon, a colored side bar, the unit in the corner and a small graphic that fits the value: hours ridden or the way to your arrival, progress along the route, calories per 10 minutes, cadence against your target band. A slim line over the big number shows sunset and temperature. Lap fields show the change against the previous lap, Workout and Pace targets say how many watts to push or ease, and the Bike page confirms a good chain line.
