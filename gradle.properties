karoopro.releaseNotes=New Climb panel: opens before each climb on a route with distance and height to the top, grade, time to the top and how long your W' lasts, on a profile colored by grade. New Segment panel for Strava Live Segments: your gap to the PR and KOM. With Karoo Coach, the Workout panel shows the next step's target before it starts. Pick the big numbers you tap through (now also 10 s power, % FTP, W/kg) and the two cards under them. New tiles (20 min and 1 h power, pedal smoothness, tyre pressure, core temp, ETA, sunset and more) and fields: PRO W' Empty In, PRO Crosswind, PRO Best 20 min.
